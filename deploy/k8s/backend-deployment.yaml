apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-backend
  namespace: soc-platform
  labels:
    app: soc-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soc-backend
  template:
    metadata:
      labels:
        app: soc-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soc-backend
          image: soc-platform/backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
              name: http
            - containerPort: 5514
              protocol: UDP
              name: syslog-udp
            - containerPort: 5515
              protocol: TCP
              name: syslog-tcp
            - containerPort: 5516
              protocol: TCP
              name: wef-http
            - containerPort: 2055
              protocol: UDP
              name: netflow-udp
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "soc_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /api/collectors/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/collectors/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: tmp-scratch
              mountPath: /tmp
      volumes:
        - name: tmp-scratch
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: soc-backend
  namespace: soc-platform
spec:
  selector:
    app: soc-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: syslog-udp
      port: 5514
      targetPort: 5514
      protocol: UDP
    - name: syslog-tcp
      port: 5515
      targetPort: 5515
      protocol: TCP
    - name: wef-http
      port: 5516
      targetPort: 5516
      protocol: TCP
    - name: netflow-udp
      port: 2055
      targetPort: 2055
      protocol: UDP
