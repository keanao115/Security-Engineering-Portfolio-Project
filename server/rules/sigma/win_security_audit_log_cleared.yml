title: Windows Security Audit Log Cleared (EventID 1102)
id: d76c0293-9bb6-46f3-8b77-cfc4856f6b5b
status: production
description: Detects clearing of Windows Security event log via WevtUtil or API calls, an adversary anti-forensics technique.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: CyberMind SOC Detection Engineering Team
date: 2024/02/01
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  category: log_cleared
  product: windows
  service: security
detection:
  selection_event:
    EventID: 1102
  selection_cli:
    CommandLine|contains:
      - 'wevtutil cl security'
      - 'wevtutil.exe cl'
      - 'Clear-EventLog -LogName Security'
  selection_details:
    details|contains:
      - 'audit log'
      - 'log cleared'
  condition: selection_event or selection_cli or selection_details
fields:
  - EventID
  - User
  - CommandLine
level: critical
response: Immediately escalate to Tier 3 SOC. Preserve physical/VM memory image. Hunt for prior privilege escalation.
