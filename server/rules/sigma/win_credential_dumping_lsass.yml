title: Credential Dumping via LSASS Memory Access (Mimikatz Pattern)
id: e489bca1-7482-4bb3-93d1-44781290bbfa
status: production
description: Detects suspicious process memory access targeting lsass.exe or execution of known credential harvesting utilities such as Mimikatz or procdump.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: CyberMind SOC Detection Engineering Team
date: 2024/02/15
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    details|contains:
      - 'lsass'
      - 'sekurlsa'
      - 'mimikatz'
      - 'procdump'
  condition: selection_target
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
level: critical
response: Enable Windows Credential Guard. Enforce RunAsPPL for LSASS. Block with Defender Attack Surface Reduction (ASR) rules.
