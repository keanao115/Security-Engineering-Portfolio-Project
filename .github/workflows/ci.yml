name: CI Pipeline & DevSecOps Automated Security Scanners

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Types & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: npm --prefix server install

      - name: Lint Backend Code (TypeScript strict check)
        run: npm --prefix server run lint

      - name: Build Backend Bundle
        run: npm --prefix server run build

      - name: Run Backend Unit & Security Tests
        env:
          JWT_SECRET: ci_test_jwt_secret_github_actions_pipeline_key
          NODE_ENV: test
        run: npm --prefix server test

  frontend-checks:
    name: Frontend Lint, Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Lint Frontend Code (ESLint)
        run: npm run lint

      - name: Build Frontend Assets (Vite)
        run: npm run build

  # ─── DevSecOps Security Job 1: Secret & Credential Leak Scanning (Gitleaks) ─
  secret-scan:
    name: Secret & Credential Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─── DevSecOps Security Job 2: SAST Static Application Security (Semgrep) ──
  sast-scan:
    name: SAST Code Security Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep OSS Security Audit
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top
            p/javascript
            p/typescript
        continue-on-error: true

  # ─── DevSecOps Security Job 3: SCA & Container/Dockerfile Scan (Trivy) ─────
  sca-container-scan:
    name: SCA & Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem & Lockfile Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
        continue-on-error: true

      - name: Run Trivy Dockerfile Config Audit
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'deploy/'
          severity: 'CRITICAL,HIGH'
          format: 'table'
        continue-on-error: true

  # ─── DevSecOps Security Job 4: IaC Security & CSPM Gatekeeping (Checkov) ───
  iac-security-scan:
    name: IaC Security & CSPM Gatekeeping (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Security Scanner on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: deploy/terraform
          framework: terraform
          output_format: cli
          soft_fail: true

