name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Types & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: npm --prefix server install

      - name: Lint Backend Code (TypeScript strict check)
        run: npm --prefix server run lint

      - name: Build Backend Bundle
        run: npm --prefix server run build

      - name: Run Backend Unit & Security Tests
        env:
          JWT_SECRET: ci_test_jwt_secret_github_actions_pipeline_key
          NODE_ENV: test
        run: npm --prefix server test

  frontend-checks:
    name: Frontend Lint, Build & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Lint Frontend Code (ESLint)
        run: npm run lint

      - name: Build Frontend Assets (Vite)
        run: npm run build
